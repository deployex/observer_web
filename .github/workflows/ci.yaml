name: Observer Web CI

on:
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  # The static analysis job doesn't vary by Elixir/OTP version, so it stays pinned to one -
  # the same version as the upper end of the test matrix below.
  elixir_version: '1.20.1'
  otp_version: '29.0.2'
  node_version: '20'

jobs:
  setup:
    name: Setup (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported versions policy (see "Supported Versions" in the README): the last two
          # major Erlang/OTP releases. 1.19.5 is the floor of the `elixir: "~> 1.19"`
          # requirement declared in mix.exs.
          - elixir: '1.19.5'
            otp: '28.5.0.6'
          - elixir: '1.20.1'
            otp: '29.0.2'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '${{ matrix.otp }}'
          elixir-version: '${{ matrix.elixir }}'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '${{ env.node_version }}'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            _build
            deps
          key: |
            observer-web-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}-2025-02-01
          restore-keys: |
            observer-web-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: assets/node_modules
          key: |
            observer-web-assets-${{ hashFiles('assets/package-lock.json') }}

      - name: Seed static directory
        run: mkdir -p priv/static && touch priv/static/app.css && touch priv/static/app.js

      - name: Install npm dependencies
        run: npm ci --prefix assets

      - name: Install Elixir dependencies
        run: mix deps.get

      # tailwind/esbuild are dev-only deps (mix.exs), and the real build has to land on disk
      # before the next step compiles Observer.Web.Assets, which reads app.css/app.js at
      # compile time - hence building under MIX_ENV=dev here, ahead of the real compile below.
      - name: Build assets
        run: mix assets.build
        env:
          MIX_ENV: dev

      - name: Compile
        run: mix compile --warnings-as-errors

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19.5'
            otp: '28.5.0.6'
          - elixir: '1.20.1'
            otp: '29.0.2'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '${{ matrix.otp }}'
          elixir-version: '${{ matrix.elixir }}'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '${{ env.node_version }}'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            _build
            deps
          key: |
            observer-web-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}-2025-02-01
          restore-keys: |
            observer-web-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: assets/node_modules
          key: |
            observer-web-assets-${{ hashFiles('assets/package-lock.json') }}

      - name: Seed static directory
        run: mkdir -p priv/static && touch priv/static/app.css && touch priv/static/app.js

      - name: Install npm dependencies
        run: npm ci --prefix assets

      - name: Install Elixir dependencies
        run: mix deps.get

      # tailwind/esbuild are dev-only deps (mix.exs), and the real build has to land on disk
      # before the implicit compile `mix coveralls.html` triggers next, which compiles
      # Observer.Web.Assets - that module reads app.css/app.js at compile time.
      - name: Build assets
        run: mix assets.build
        env:
          MIX_ENV: dev

      - name: Run tests
        run: mix coveralls.html

  analysis:
    name: Static Analysis
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: '${{ env.otp_version }}'
          elixir-version: '${{ env.elixir_version }}'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '${{ env.node_version }}'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            _build
            deps
          key: |
            observer-web-${{ env.elixir_version }}-${{ env.otp_version }}-${{ hashFiles('mix.lock') }}-2025-02-01
          restore-keys: |
            observer-web-${{ env.elixir_version }}-${{ env.otp_version }}-

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: assets/node_modules
          key: |
            observer-web-assets-${{ hashFiles('assets/package-lock.json') }}

      - name: Seed static directory
        run: mkdir -p priv/static && touch priv/static/app.css && touch priv/static/app.js

      - name: Install npm dependencies
        run: npm ci --prefix assets

      - name: Install Elixir dependencies
        run: mix deps.get

      # tailwind/esbuild are dev-only deps (mix.exs), and the real build has to land on disk
      # before the next step compiles Observer.Web.Assets, which reads app.css/app.js at
      # compile time - hence building under MIX_ENV=dev here, ahead of the real compile below.
      - name: Build assets
        run: mix assets.build
        env:
          MIX_ENV: dev

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run mix deps.unlock
        run: mix deps.unlock --check-unused

      - name: Credo
        run: mix credo --strict

      - name: Ex Doc
        run: mix docs --failed

      - name: Mix Audit
        run: mix deps.audit

      - name: Mix Sobelow
        run: mix sobelow --exit --threshold medium --skip

      - name: Formatted
        run: mix format --check-formatted

      - name: Restore PLT cache
        uses: actions/cache@v6
        id: plt_cache
        with:
          key: plt-${{ env.otp_version }}-${{ env.elixir_version }}-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex') }}
          restore-keys: |
            plt-${{ env.otp_version }}-${{ env.elixir_version }}-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex') }}
            plt-${{ env.otp_version }}-${{ env.elixir_version }}-${{ hashFiles('**/mix.lock') }}-
            plt-${{ env.otp_version }}-${{ env.elixir_version }}-
            plt-${{ env.otp_version }}-
          path: priv/plts

      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true' || github.run_attempt != '1'
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format github
